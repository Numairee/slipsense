name: Build & Release SlipSense Android APK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build SlipSense APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read release version
        id: release
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=SlipSense-v$VERSION.apk" >> "$GITHUB_OUTPUT"
      - name: Install, test and build web app
        run: |
          npm ci
          npm test
          npm run build
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Sync Capacitor to Android
        run: npx cap sync android
      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Prepare APK
        env:
          APK_NAME: ${{ steps.release.outputs.apk }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlipSense-v${{ steps.release.outputs.version }}-APK
          path: ${{ steps.release.outputs.apk }}
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SlipSense v${{ steps.release.outputs.version }}
          body: |
            ## SlipSense v${{ steps.release.outputs.version }}
            - ค้นหาสลิปจากทุกรูปในทุกโฟลเดอร์ที่แอปมีสิทธิ์อ่าน ไม่มีจำกัดจำนวนรูป
            - ปรับการแยกยอดเงิน ค่าธรรมเนียม เลขไทย วันที่ และ Mini-QR
            - ตรวจแก้ข้อมูลพร้อมภาพสลิปก่อนบันทึก และตรวจสลิปซ้ำในชุดเดียวกัน
            - แสดงความคืบหน้าและแจ้งกรณี Android อนุญาตเฉพาะบางรูป
            - แก้กรณีสแกนค้างและบันทึกไม่สำเร็จ

            เลือกสิทธิ์รูปภาพเป็น “อนุญาตทั้งหมด” เพื่อให้สแกนได้ครบ รูปที่อยู่เฉพาะบนคลาวด์หรือในพื้นที่ส่วนตัวของแอปอื่นจะไม่ถูกอ่าน
            การตรวจทุกรูปไม่ได้รับประกันว่าจะอ่านสลิปทุกใบสำเร็จ กรุณาตรวจยอด วันที่ และผู้รับก่อนบันทึก
          files: ${{ steps.release.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
