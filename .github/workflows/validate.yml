name: Validate slip parsing and web build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Native amount, date and QR regression checks
        run: |
          javac -d /tmp/slip-tests android/app/src/main/java/com/pygmy/notrack/SlipDateParser.java android/app/src/main/java/com/pygmy/notrack/SlipAmountParser.java android/app/src/main/java/com/pygmy/notrack/SlipQrParser.java tests/SlipAmountParserTest.java
          java -cp /tmp/slip-tests SlipAmountParserTest
