<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Pygmy: No-Track Tracker v1.0.2 - แอปจดรายจ่ายแบบไม่จดสำหรับ Android ออฟไลน์ 100% ไม่ส่งข้อมูลออกนอกเครื่อง" />
    <title>Pygmy v1.0.2: จดรายจ่ายแบบไม่จด (No-Track Tracker)</title>
  </head>
  <body class="bg-[#FAF8F5] text-neutral-900 select-none overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Force-clear any stale Service Worker caches from earlier builds so UI updates immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (let reg of regs) reg.unregister();
        }).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then(keys => {
          for (let key of keys) caches.delete(key);
        }).catch(() => {});
      }
    </script>
  </body>
</html>
