    <meta name="description" content="SlipSense v2.0.0: Smart Slip & Wealth Intelligence - ตรวจจับและวิเคราะห์สลิปธนาคารไทยออฟไลน์ 100% ในเครื่อง ไม่ส่งข้อมูลออกภายนอก" />
    <title>SlipSense: Smart Slip & Wealth Intelligence (No-Track)</title>
  </head>
  <body class="bg-[#080C14] text-white select-none overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Force-clear any stale Service Worker caches from earlier builds so UI updates immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (let reg of regs) reg.unregister();
        }).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then(keys => {
          for (let key of keys) caches.delete(key);
        }).catch(() => {});
      }
    </script>
  </body>
